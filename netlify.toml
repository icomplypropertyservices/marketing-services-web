# iComply Marketing Services — PREVIEW SITE ONLY
# Site name: icomply-marketing-services
# Preview URL: https://icomply-marketing-services.netlify.app
# NETLIFY_SITE_ID: a888cb51-357f-4572-95a0-57e1b080b8f6
# Do NOT attach icomplymarketingservices.co.uk or www until Jack says go.
# NETLIFY_AUTH_TOKEN lives in GitHub Actions secrets only, never in git.

[build]
  command = "php website/bin/static-export.php && php website/bin/check-static-export.php"
  publish = "dist"

[build.environment]
  PHP_VERSION = "8.3"
  SITE_URL = "https://icomplymarketingservices.co.uk"

# Source folders are never published (publish = dist), but 404 them anyway
# in case the publish root is ever misconfigured.
[[redirects]]
  from = "/website/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Preview-Site = "icomply-marketing-services"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
