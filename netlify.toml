# iComply Marketing Services — LIVE (Jack Scott go, 2026-10-06)
# Site name: icomply-marketing-services
# Live URL: https://icomply-marketing-services.netlify.app (canonical host, see website/config/site.php)
# NETLIFY_SITE_ID: a888cb51-357f-4572-95a0-57e1b080b8f6
# Apex icomplymarketingservices.co.uk is NOT registered yet: do not attach a custom domain or touch DNS.
# NETLIFY_AUTH_TOKEN lives in GitHub Actions secrets only, never in git.

[build]
  command = "php website/bin/static-export.php && php website/bin/check-static-export.php"
  publish = "dist"

[build.environment]
  PHP_VERSION = "8.3"
  # Canonical host comes from website/config/site.php (site_url). No SITE_URL override here.

# Source folders are never published (publish = dist), but 404 them anyway
# in case the publish root is ever misconfigured.
[[redirects]]
  from = "/website/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
