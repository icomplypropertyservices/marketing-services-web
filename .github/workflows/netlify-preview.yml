name: Netlify PR preview

on:
  pull_request:
    branches: [main]

# Draft deploy per PR with alias pr-<number>. Never --prod. No apex DNS.
# SITE_ID: a888cb51-357f-4572-95a0-57e1b080b8f6

permissions:
  contents: read

jobs:
  pr-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Static export + checks
        env:
          SITE_URL: https://icomplymarketingservices.co.uk
        run: |
          php website/bin/static-export.php
          php website/bin/check-static-export.php

      - name: Draft deploy (alias pr-N)
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set. Build + checks passed; deploy skipped."
            exit 0
          fi
          if [ "${NETLIFY_SITE_ID}" != "a888cb51-357f-4572-95a0-57e1b080b8f6" ]; then
            echo "Refusing deploy: SITE_ID is not the Marketing Services preview site."
            exit 1
          fi
          npx --yes netlify-cli deploy --dir=dist --site="${NETLIFY_SITE_ID}" --alias "pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA}"
